<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教育心理學課堂點名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* 與課堂搶答同一套亮色舞台 */
:root{
  --stage:#eef1fa; --stage-2:#ffffff; --line:#dde2f1; --ink:#1c1f3a; --mute:#646a8c;
  --brand:#33358f; --brand-d:#23246b; --ok:#14966f; --bad:#e5484d; --gold:#f2b632;
  --shadow:0 1px 2px #1c1f3a0f,0 10px 30px #33358f14;
  --display:"Bungee","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#c9d2ff,transparent 70%),radial-gradient(700px 420px at -10% 110%,#ffe2b8,transparent 70%),var(--stage);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:20px;min-height:100%}
.brand{font-weight:900;font-size:22px;letter-spacing:.04em;color:var(--brand)}
.btn{background:var(--brand);color:#fff;font-weight:900;padding:14px 26px;border-radius:14px;font-size:18px;box-shadow:0 5px 0 var(--brand-d);transition:transform .08s;text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brand-d)}
.btn.ghost{background:var(--stage-2);color:var(--brand);border:2px solid var(--line);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.panel{background:var(--stage-2);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.muted{color:var(--mute)}
.center{text-align:center}
.err{color:var(--bad);font-weight:700;min-height:1.2em}
h1,h2{margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px;color:var(--mute)}
.field input{background:var(--stage);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:14px;font-size:22px;font-family:var(--body);width:100%;letter-spacing:.08em}
.phone{max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.phone .btn{width:100%}
.check{width:120px;height:120px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:72px;color:#fff;background:var(--ok)}
.check.no{background:var(--bad)}
.who{font-size:34px;font-weight:900;letter-spacing:.1em}
.linkbtn{background:none;color:var(--mute);text-decoration:underline;font-size:15px;padding:8px}
/* 投影 */
body.host .wrap{max-width:none;padding-block:2.2vh}
.stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3vw;align-items:center;flex:1}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;width:min(72vh,46vw);aspect-ratio:1;display:grid;place-items:center}
.qrbox img,.qrbox canvas{width:100%!important;height:auto!important}
.count{font-family:var(--display);font-size:clamp(80px,11vw,200px);line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.count small{font-size:.4em;color:var(--mute)}
.hint{font-size:clamp(18px,1.6vw,28px);font-weight:700}
/* 紀錄 */
.rec{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.rec th,.rec td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.rec th{color:var(--mute);font-size:13px;letter-spacing:.06em}
.rec tr.absent td{color:var(--bad)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#fff3d6;color:#8a5a00;margin-left:6px}
.sess{display:flex;flex-wrap:wrap;gap:10px}
.sess .btn.on{background:var(--brand);color:#fff}
.copy{text-align:center;color:var(--mute);font-size:13px;letter-spacing:.08em;margin-top:auto;padding-top:8px}
@media (max-width:760px){.stage{grid-template-columns:1fr}.qrbox{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div id="app" style="display:flex;flex-direction:column;gap:20px;flex:1"></div><footer class="copy">© 袁齊笙博士版權所有</footer></div>
<script>
const SB_URL = "https://uqrivwblsrhqtlvobdmn.supabase.co";
const SB_KEY = "sb_publishable_mQWkr11yVYAce8jpkeeZlg_kA6-8BKe";
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}}, set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)), del:k=>localStorage.removeItem(k)};
const hhmm = t => new Date(t).toLocaleTimeString("zh-TW",{hour12:false});
async function rpc(fn, args){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method:"POST", headers:{apikey:SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify(args||{})
  });
  const t = await r.text(); const j = t ? JSON.parse(t) : null;
  if(!r.ok) throw new Error((j && j.message) || r.statusText);
  return j;
}

/* ---------- 投影端：任何人隨時可開一場；只有開場的這個頁面能結束它。QR 碼由伺服器每 10 秒換一次 ---------- */
function host(){
  document.body.classList.add("host");
  app.innerHTML = `<div class="panel center" style="margin:auto;display:grid;gap:18px;max-width:560px">
    <h1>教育心理學課堂點名</h1><button class="btn" id="open">開始點名</button><div class="err" id="e"></div></div>`;
  $("#open").onclick = async () => {
    try{ const s = await rpc("rc_open_pub"); projection(s.id); } catch(e){ $("#e").textContent = "連線失敗，請再按一次。"; }
  };
}
function projection(sid){
  app.innerHTML = `<div class="stage">
      <div class="qrbox" id="qr"></div>
      <div style="display:grid;gap:3vh">
        <div class="brand">教育心理學課堂點名</div>
        <div class="hint">手機掃 QR 碼，輸入學號</div>
        <div><div class="muted hint">已簽到</div><div class="count" id="n">0<small> / 0</small></div></div>
        <div><button class="btn ghost" id="close">結束點名</button></div>
      </div></div>`;
  let last = "", timer;
  const tick = async () => {
    let v;
    try{ v = await rpc("rc_host_view_pub", {p_session:sid}); }
    catch(e){ return void (timer = setTimeout(tick, 3000)); }
    if(v.closed) return ended(v);
    if(v.token !== last){
      last = v.token; $("#qr").innerHTML = "";
      new QRCode($("#qr"), {text:`${location.origin}${location.pathname}?t=${v.token}`, width:512, height:512, correctLevel:QRCode.CorrectLevel.M});
    }
    $("#n").innerHTML = `${v.count}<small> / ${v.total}</small>`;
    timer = setTimeout(tick, 2000);
  };
  $("#close").onclick = async () => {
    if(!confirm("確定結束點名？")) return;
    clearTimeout(timer); await rpc("rc_close_pub", {p_session:sid}); tick();
  };
  tick();
}
function ended(v){
  app.innerHTML = `<div class="panel center" style="margin:auto;display:grid;gap:18px;max-width:560px">
    <h1>點名已結束</h1><div class="count">${v.count}<small> / ${v.total}</small></div></div>`;
}

/* ---------- 學生端 ---------- */
const MSG = {
  expired: "QR 碼已過期，請重新掃描投影幕上的 QR 碼。",
  closed: "本次點名已經結束。",
  not_on_roster: "這個學號不在修課名單上，請再確認一次。"
};
const device = store.get("rc_dev") || (store.set("rc_dev", crypto.randomUUID()), store.get("rc_dev"));
function student(tok){
  if(!tok){ app.innerHTML = `<div class="phone panel center"><h2>請用手機相機掃描投影幕上的 QR 碼</h2></div>`; return; }
  const saved = store.get("rc_sid");
  saved ? confirmStep(tok, saved) : askSid(tok);
}
function askSid(tok, err=""){
  app.innerHTML = `<div class="phone panel"><h2>課堂點名</h2>
    <div class="field"><label for="sid">學號</label><input id="sid" inputmode="text" autocapitalize="characters" autocomplete="off" maxlength="12"></div>
    <div class="err" id="e">${esc(err)}</div><button class="btn" id="go">下一步</button></div>`;
  const go = () => { const v = $("#sid").value.normalize("NFKC").trim().toUpperCase(); if(v) confirmStep(tok, v); };
  $("#go").onclick = go; $("#sid").onkeydown = e => { if(e.key === "Enter") go(); };
  $("#sid").focus();
}
async function confirmStep(tok, sid){
  let r;
  try{ r = await rpc("rc_check_in", {p_tok:tok, p_sid:sid, p_device:device, p_commit:false}); }
  catch(e){ return e.message === "not_on_roster" ? (store.del("rc_sid"), askSid(tok, MSG.not_on_roster)) : fail(e); }
  if(r.already) return done(r, true);
  app.innerHTML = `<div class="phone panel center" style="display:grid;gap:16px">
    <div class="muted">${esc(sid)}</div><div class="who">${esc(r.name)}</div>
    <button class="btn" id="ok">是我，確認簽到</button>
    <button class="linkbtn" id="no">不是我，重新輸入學號</button></div>`;
  $("#no").onclick = () => { store.del("rc_sid"); askSid(tok); };
  $("#ok").onclick = async () => {
    $("#ok").disabled = true;
    try{ const d = await rpc("rc_check_in", {p_tok:tok, p_sid:sid, p_device:device, p_commit:true}); store.set("rc_sid", sid); done(d, d.already); }
    catch(e){ fail(e); }
  };
}
function done(r, already){
  history.replaceState(null, "", location.pathname);
  app.innerHTML = `<div class="phone panel center" style="display:grid;gap:14px">
    <div class="check">✓</div><h1>${already ? "你已經簽到過了" : "簽到成功"}</h1>
    <div class="who">${esc(r.name)}</div><div class="muted">${esc(hhmm(r.at))}</div></div>`;
}
function fail(e){
  history.replaceState(null, "", location.pathname);
  app.innerHTML = `<div class="phone panel center" style="display:grid;gap:14px">
    <div class="check no">!</div><h2>${esc(MSG[e.message] || "連線失敗，請重新掃描 QR 碼。")}</h2></div>`;
}

const qs = new URLSearchParams(location.search);
if(qs.has("host")) host();
else student(qs.get("t"));
</script>
</body>
</html>
